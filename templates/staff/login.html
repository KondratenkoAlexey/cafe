{% extends "base.html" %}

{% block title %}Вход персонала · Кафе{% endblock %}

{% block content %}
<div class="login-shell">
  <div class="surface-card login-card p-4 p-md-5">
    <div class="page-hero mb-4">
      <h1 class="h2">Вход персонала</h1>
      <p>Официанты, повара и администраторы.</p>
    </div>
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" class="d-grid gap-3">
      {% csrf_token %}
      <div>
        <label class="form-label" for="id_username">Логин</label>
        <input class="form-control form-control-lg" type="text" name="username" id="id_username"
               autocomplete="username" required>
      </div>
      <div>
        <label class="form-label" for="id_password">Пароль</label>
        <input class="form-control form-control-lg" type="password" name="password" id="id_password"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-lg btn-touch" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
